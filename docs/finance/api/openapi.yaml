        "operationId": "updateAccounts",
        "description": "Current Finance Owner only. Fresh password plus Supabase fresh TOTP, shared six/minute actor reauthentication limit; strict allowlisted body. Versions refer to the target record. Atomic config/audit/permanent receipt; no credentials retained. Account mappings/parents/normal sides/control types are cross-validated; used mappings cannot change. Periods are inclusive and non-overlapping, used dates fixed. Closing/reopening is not exposed.",
        "parameters": [
