    "/api/v1/finance/accounts": {
      "post": {
        "operationId": "createAccounts",
        "description": "Current Finance Owner only. Fresh password plus Supabase fresh TOTP, shared six/minute actor reauthentication limit; strict allowlisted body. Versions refer to the target record. Atomic config/audit/permanent receipt; no credentials retained. Account mappings/parents/normal sides/control types are cross-validated; used mappings cannot change. Periods are inclusive and non-overlapping, used dates fixed. Closing/reopening is not exposed.",
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Canonical application origin."
          },
          {
            "name": "X-Encova-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "const": "1"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AccountCreate"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Canonical setup result {data:{id,version}}; successful replay returns the original record version after current authorization.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "id",
                        "version"
                      ],
                      "properties": {
                        "id": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "version": {
                          "type": "integer",
                          "minimum": 1
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Missing/invalid idempotency key"
          },
          "401": {
            "description": "No current verified application session"
          },
          "403": {
            "description": "Current role/grant/owner, password, MFA or origin denial"
          },
          "404": {
            "description": "Finance disabled or record unavailable"
          },
          "409": {
            "description": "Stale version, duplicate code, mapping/parent/used-period state, inclusive period overlap or request-key conflict"
          },
          "422": {
            "description": "Invalid allowlisted field, classification, real date or strict JSON body"
          },
          "429": {
            "description": "Actor rate limit exceeded"
          },
          "500": {
            "description": "Safe internal error with request ID"
          }
        }
      },
      "get": {
        "operationId": "listAccounts",
        "description": "Current active selected Super Admin, owner or read-only administrator. Feature-off 404 before finance queries; authorization precedes query/ID validation. All responses private/no-store. No arbitrary sort or query expression.",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 100,
              "default": ""
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1,
              "maximum": 10000
            }
          },
          {
            "name": "pageSize",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            }
          },
          {
            "name": "active",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "ACTIVE",
                "ARCHIVED",
                "ALL"
              ],
              "default": "ACTIVE"
            }
          },
          {
            "name": "type",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "ALL",
                "ASSET",
                "LIABILITY",
                "EQUITY",
                "INCOME",
                "DIRECT_COST",
                "OPERATING_EXPENSE",
                "OTHER_INCOME",
                "OTHER_EXPENSE"
              ],
              "default": "ALL"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "No current verified application session"
          },
          "403": {
            "description": "Current role/grant/owner, password, MFA or origin denial"
          },
          "404": {
            "description": "Finance disabled or record unavailable"
          },
          "422": {
            "description": "Invalid allowlisted field, classification, real date or strict JSON body"
          },
          "429": {
            "description": "Actor rate limit exceeded"
          },
          "500": {
            "description": "Safe internal error with request ID"
          },
          "200": {
            "description": "Authorized setup DTO. List: items,total,pages,page,pageSize,filters,canManage; accounts also returns up to 100 active parent groups. Detail: item,canManage,latest 25 restricted history entries; accounts also groups and derived mappingLocked. No balances, financial transactions or credentials. Record usage is nullable ISO timestamp; period dates are ISO dates. Unknown filters rejected. Fixed code/id or startDate-desc/id order; out-of-range page is clamped."
          }
        }
      }
    },
