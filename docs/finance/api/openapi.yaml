{
  "openapi": "3.1.0",
  "info": {
    "title": "Encova Finance Access",
    "version": "0.2.0",
    "description": "F01\u2013F04 access/ownership only. Finance remains disabled live. All responses, including errors, use private/no-store. Existing browser sessions only; no new API key or Bearer login mechanism. No public bootstrap/recovery endpoints."
  },
  "security": [
    {
      "existingBrowserSession": []
    }
  ],
  "paths": {
    "/api/v1/finance/status": {
      "get": {
        "operationId": "financeStatus",
        "description": "Current ACTIVE SUPER_ADMIN plus explicit grant; disabled feature returns 404 before authentication. Capability status only, not accounting readiness.",
        "responses": {
          "200": {
            "description": "Minimal capability status",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "currency",
                        "stage"
                      ],
                      "properties": {
                        "currency": {
                          "const": "PKR"
                        },
                        "stage": {
                          "const": "ACCESS_FOUNDATION"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "No current verified application session"
          },
          "403": {
            "description": "Current role/grant/owner, password, MFA or origin denial"
          },
          "404": {
            "description": "Finance disabled or record unavailable"
          },
          "429": {
            "description": "Actor rate limit exceeded"
          },
          "500": {
            "description": "Safe internal error with request ID"
          }
        }
      }
    },
    "/api/v1/finance/access": {
      "get": {
        "operationId": "financeAccessSnapshot",
        "description": "Authorized owner/control snapshot. Only the current owner receives eligible administrators and all active grants; other selected users receive their own grants/pending target transfer. Includes bounded recent restricted audit history.",
        "responses": {
          "200": {
            "description": "Current control snapshot; dates are ISO timestamps, IDs UUIDs, owner/settings/record versions are integers."
          },
          "401": {
            "description": "No current verified application session"
          },
          "403": {
            "description": "Current role/grant/owner, password, MFA or origin denial"
          },
          "404": {
            "description": "Finance disabled or record unavailable"
          },
          "429": {
            "description": "Actor rate limit exceeded"
          },
          "500": {
            "description": "Safe internal error with request ID"
          }
        }
      }
    },
    "/api/v1/finance/access/grants": {
      "post": {
        "operationId": "grantFinanceAccess",
        "description": "Requires fresh self-password verification plus fresh Supabase TOTP; only the current owner may act except acceptance by the intended selected recipient. Version is FinanceSettings for create/revoke/request, FinanceOwnershipTransfer for accept/cancel. Replays return the canonical result after current authorization; credentials are not hashed/stored in receipts.",
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Canonical application origin."
          },
          {
            "name": "X-Encova-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "const": "1"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 128
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "targetId",
                  "expectedVersion",
                  "reason",
                  "reauth"
                ],
                "properties": {
                  "targetId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "expectedVersion": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "reason": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 500
                  },
                  "reauth": {
                    "$ref": "#/components/schemas/Reauthentication"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Canonical access-action result (including successful replay)",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "id",
                        "version"
                      ],
                      "properties": {
                        "id": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "version": {
                          "type": "integer",
                          "minimum": 1
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Missing/invalid idempotency key"
          },
          "401": {
            "description": "No current verified application session"
          },
          "403": {
            "description": "Current role/grant/owner, password, MFA or origin denial"
          },
          "404": {
            "description": "Finance disabled or record unavailable"
          },
          "409": {
            "description": "Version/state, protected owner or request-key conflict"
          },
          "422": {
            "description": "Invalid input or ineligible target"
          },
          "429": {
            "description": "Actor rate limit exceeded"
          },
          "500": {
            "description": "Safe internal error with request ID"
          }
        }
      }
    },
