  "components": {
    "securitySchemes": {
      "existingBrowserSession": {
        "type": "apiKey",
        "in": "header",
        "name": "Cookie",
        "description": "The existing authenticated browser Cookie header (Supabase SSR or guarded local Better Auth). This describes the whole existing session header, not a new API key; browsers send it automatically. Do not expose cookies to client JavaScript or shared logs."
      }
    },
    "schemas": {
      "Reauthentication": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "password"
        ],
        "properties": {
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "writeOnly": true
          },
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$",
            "writeOnly": true,
            "description": "Mandatory fresh TOTP for Supabase, including when company MFA is optional; absent only in guarded loopback Better Auth development."
          }
        }
      },
      "AccountCreate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[A-Z0-9][A-Z0-9._-]{1,19}$",
            "description": "Trimmed and uppercased before validation."
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "type": {
            "type": "string",
            "enum": [
              "ASSET",
              "LIABILITY",
              "EQUITY",
              "INCOME",
              "DIRECT_COST",
              "OPERATING_EXPENSE",
              "OTHER_INCOME",
              "OTHER_EXPENSE"
            ]
          },
          "normalSide": {
            "type": "string",
            "enum": [
              "DEBIT",
              "CREDIT"
            ]
          },
          "reportGroup": {
            "type": "string",
            "enum": [
              "CURRENT_ASSETS",
              "NONCURRENT_ASSETS",
              "CURRENT_LIABILITIES",
              "NONCURRENT_LIABILITIES",
              "EQUITY",
              "REVENUE",
              "DIRECT_COSTS",
              "OPERATING_EXPENSES",
              "OTHER_INCOME",
              "OTHER_EXPENSES"
            ]
          },
          "controlType": {
            "type": "string",
            "enum": [
              "NONE",
              "CASH",
              "RECEIVABLES",
              "PAYABLES",
              "CLIENT_ADVANCE",
              "SUPPLIER_ADVANCE",
              "FIXED_ASSET",
              "ACCUMULATED_DEPRECIATION",
              "INVESTMENT",
              "LOAN_RECEIVABLE",
              "LOAN_PAYABLE",
              "DEFERRED_REVENUE",
              "TAX_INPUT",
              "TAX_OUTPUT",
              "WITHHOLDING_RECEIVABLE",
              "WITHHOLDING_PAYABLE"
            ]
          },
          "currency": {
            "type": "string",
            "const": "PKR",
            "default": "PKR"
          },
          "parentId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid",
            "default": null
          },
          "isPosting": {
            "type": "boolean"
          },
          "isContra": {
            "type": "boolean"
          },
          "isCashEquivalent": {
            "type": "boolean"
          },
          "reason": {
            "type": "string",
            "minLength": 3,
            "maxLength": 500
          },
          "reauth": {
            "$ref": "#/components/schemas/Reauthentication"
          }
        },
        "required": [
          "code",
          "name",
          "type",
          "normalSide",
          "reportGroup",
          "controlType",
          "isPosting",
          "isContra",
          "isCashEquivalent",
          "reason",
          "reauth"
        ]
      },
