  "components": {
    "securitySchemes": {
      "existingBrowserSession": {
        "type": "apiKey",
        "in": "header",
        "name": "Cookie",
        "description": "The existing authenticated browser Cookie header (Supabase SSR or guarded local Better Auth). This describes the whole existing session header, not a new API key; browsers send it automatically. Do not expose cookies to client JavaScript or shared logs."
      }
    },
    "schemas": {
      "Reauthentication": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "password"
        ],
        "properties": {
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "writeOnly": true
          },
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$",
            "writeOnly": true,
            "description": "Mandatory fresh TOTP for Supabase, including when company MFA is optional; absent only in guarded loopback Better Auth development."
          }
        }
      }
    }
  }
}
