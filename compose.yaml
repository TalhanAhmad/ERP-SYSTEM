services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: encova
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local_only}
      POSTGRES_DB: encova_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encova -d encova_dev"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres_data:
