name: Verify workspace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: encova
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: encova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U encova -d encova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://encova:ci_only@localhost:5432/encova_test
      TEST_DATABASE_URL: postgresql://encova:ci_only@localhost:5432/encova_test
      BETTER_AUTH_SECRET: ci-synthetic-secret-only-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e:prepare
      - run: pnpm build
      # The 24.04 runner already supplies Chromium's shared libraries. Reinstalling
      # optional OS/font packages failed on the Ubuntu mirror DNS before tests.
      # Install the exact browser required by the lockfile; browser launch still
      # validates runtime dependencies and the complete E2E suite remains required.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Verify Supabase-mode production build (configuration fixtures only)
        run: pnpm build:vercel
        env:
          AUTH_PROVIDER: supabase
          APP_URL: https://workspace.example.test
          SUPABASE_URL: https://supabase.example.test
          SUPABASE_PUBLISHABLE_KEY: synthetic-publishable-key
          SUPABASE_SECRET_KEY: synthetic-server-only-key
          DATABASE_URL: postgresql://app:synthetic@region.pooler.supabase.com:6543/postgres
          CRON_SECRET: synthetic-cron-secret-at-least-32-characters
          VERCEL_ENV: production
      - run: pnpm verify:docs
